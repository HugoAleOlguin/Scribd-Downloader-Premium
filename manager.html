<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Scribd Download Manager</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Segoe UI', sans-serif;
            background: #121212;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .container {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            width: 400px;
            text-align: center;
        }

        h1 {
            margin: 0 0 20px 0;
            font-size: 24px;
            color: #4caf50;
        }

        #status {
            font-size: 16px;
            margin-bottom: 20px;
            color: #ccc;
        }

        .progress-bar {
            height: 10px;
            background: #333;
            border-radius: 5px;
            overflow: hidden;
            margin-bottom: 20px;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4caf50, #8bc34a);
            width: 0%;
            transition: width 0.3s;
        }

        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #4caf50;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
            display: none;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        button {
            padding: 12px 24px;
            background: #2196f3;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover {
            background: #1976d2;
        }

        button:disabled {
            background: #444;
            color: #888;
            cursor: not-allowed;
        }

        #log {
            margin-top: 20px;
            text-align: left;
            font-size: 12px;
            color: #666;
            max-height: 150px;
            overflow-y: auto;
            background: #111;
            padding: 10px;
            border-radius: 4px;
            font-family: monospace;
        }

        .error {
            color: #ff5252;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>📥 Descargando Documento</h1>
        <div class="loader" id="loader"></div>
        <div id="status">Esperando conexión...</div>
        <div class="progress-bar">
            <div id="fill" class="progress-fill"></div>
        </div>

        <script src="libs/jspdf.umd.min.js"></script>
        <script src="manager.js"></script>

        <div id="log">Log de eventos...</div>
        <button id="retryBtn" style="display:none;" onclick="location.reload()">Reintentar</button>
    </div>
</body>

</html>
