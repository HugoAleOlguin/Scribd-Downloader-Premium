<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Scribd Downloader</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            width: 280px;
            padding: 20px;
            font-family: system-ui, sans-serif;
            font-size: 14px;
            background: #111827;
            color: #f3f4f6;
        }

        h1 {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        p {
            font-size: 12px;
            color: #9ca3af;
            line-height: 1.5;
        }

        .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            margin-right: 6px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0.4; }
        }
    </style>
</head>
<body>
    <h1><span class="dot"></span>Scribd Downloader</h1>
    <p>Navega a un documento de Scribd y usa el panel flotante para descargarlo.</p>
</body>
</html>
